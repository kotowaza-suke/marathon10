
name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Staging
        id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSHE_SSH_KEY }}

      - name: Deploy Staging
        run: |
          ssh ${{ steps.ssh.outputs.SERVER }} \
          bash /app/${{ secrets.DEV_SSH_USER }}/deploy.sh \
          ${{ secrets.DEV_SSH_USER }}

      - name: Test Staging
        run: |
          ssh ${{ steps.ssh.outputs.SERVER }} \
          'curl --fail --connect-timeout 10 --max-time 30 http://localhost/'

  production:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - name: SSH Production
        id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy Production
        run: |
          ssh ${{ steps.ssh.outputs.SERVER }} \
          bash /app/${{ secrets.PROD_SSH_USER }}/deploy.sh \
          ${{ secrets.PROD_SSH_USER }}
